# Fly.io 部署配置（境外小机器，自带 HTTPS 域名，无需自己买域名）
#
# 1. fly launch --no-deploy --name starhall-<你的后缀> --region hkg
# 2. fly secrets set LLM_API_KEY=... LLM_MODEL=...   （以及 .env 里其他 LLM_* ）
# 3. fly deploy
# 4. 知道域名后设这两个（把 <app> 换成 fly 给你的名字）：
#      fly secrets set STARHALL_ALLOWED_HOSTS=<app>.fly.dev STARHALL_PUBLIC_BASE_URL=https://<app>.fly.dev
#      fly secrets set STARHALL_OPEN_REGISTRATION=true
# 5. node scripts/deploy-check.js https://<app>.fly.dev

app = "starhall"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  STARHALL_HOST = "0.0.0.0"
  STARHALL_PORT = "4317"
  STARHALL_DATA_DIR = "/data"
  LLM_PROVIDER = "ark-responses"
  LLM_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"
  LLM_JSON_OUTPUT = "true"
  LLM_THINKING = "disabled"
  LLM_FALLBACK = "true"

[http_service]
  internal_port = 4317
  force_https = true
  # 比赛期间绝对不能休眠：order 最长 115 秒，冷启动会让别的 agent 判定我们超时。
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # 交付最长 115 秒，代理层必须比它宽。
  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[mounts]]
  source = "starhall_data"
  destination = "/data"
