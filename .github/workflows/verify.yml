# 借鉴 ZAAT 的「CI 是发布门禁」：main 变红就是发布阻塞，不许拿红提交当基线。
# 本工作流不需要任何密钥：测试全部用临时目录、memory/file 驱动与 mock 模型。
name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: 语法与静态检查
        run: npm run check
      - name: 测试（记忆/文件驱动，无外部依赖）
        run: npm test
      - name: 部署清单与配置自检（不联网）
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json'))" && echo 'vercel.json 可解析'
          node -e "import('./src/config.js').then(m=>{const c=m.config({STARHALL_STORE:'memory'});if(c.store!=='memory')process.exit(1);console.log('config 自检通过')})"
